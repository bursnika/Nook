# Render Blueprint: one Docker web service (API + SPA + admin), Postgres and Redis (cache).
# New → Blueprint on https://dashboard.render.com, pick this repository. See docs/deploy-render.md.
services:
  - type: web
    name: nook
    runtime: docker
    dockerfilePath: ./infra/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nook-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nook-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false

  - type: keyvalue
    name: nook-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: nook-db
    plan: free
    databaseName: nook
    user: nook

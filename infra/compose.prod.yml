# Production stack on one VM: Caddy (HTTPS) in front of the API, Postgres behind it.
# Copied to the server by the deploy job; secrets live in a .env file next to it (see docs/deploy.md).
name: nook

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nook
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache for GET lists (see docs/b9-caching.md). Nothing here must survive a restart.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker for reminders and Google sync jobs (docs/b8-queues.md). Reachable only inside the compose
  # network: no published ports, no management UI. Queues live in the volume.
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nook
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  migrate:
    image: ${IMAGE_PREFIX:?}-migrate:latest
    command: ['pnpm', '--filter', '@nook/api', 'db:deploy']
    environment:
      DATABASE_URL: postgresql://nook:${POSTGRES_PASSWORD}@postgres:5432/nook?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${IMAGE_PREFIX:?}-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nook:${POSTGRES_PASSWORD}@postgres:5432/nook?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://${DOMAIN}/api/auth/google/callback
      COOKIE_SECURE: 'true'
      PUBLIC_URL: https://${DOMAIN}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_DIGEST_HOUR_UTC: ${TELEGRAM_DIGEST_HOUR_UTC:-6}
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://nook:${RABBITMQ_PASSWORD:-${POSTGRES_PASSWORD}}@rabbitmq:5672
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-30}
      GOOGLE_SYNC_EVERY_MINUTES: ${GOOGLE_SYNC_EVERY_MINUTES:-30}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nook-uploads}
      # Optional: AI planning assistant (Pro); without a key it answers 503 (docs/c21-assistant.md)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  uploads:
  caddy-data:
  caddy-config:

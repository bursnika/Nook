name: nook

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    # host port 5433 (not 5432) so it does not clash with other local Postgres instances
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then exits. The API starts after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: build
    command: ['pnpm', '--filter', '@nook/api', 'db:deploy']
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
      # Required: copy infra/.env.example to infra/.env and fill it in (docker compose reads it automatically)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (see infra/.env.example)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Google sign-in stays disabled until both are set
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      # Plain http on localhost; set to true once the stack is served over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  uploads:

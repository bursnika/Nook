name: nook

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    # host port 5433 (not 5432) so it does not clash with other local Postgres instances
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache for GET lists (see docs/b9-caching.md). Nothing here must survive a restart.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    # host port 6380 for running the API outside Docker (REDIS_URL=redis://localhost:6380)
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker for reminders and Google sync jobs (see docs/b8-queues.md). The management UI is not
  # part of this image; inspect with `docker compose exec rabbitmq rabbitmqctl list_queues` or GET /api/queue-status.
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    # RabbitMQ keeps its data under the node name, which comes from the hostname: pin it, or a recreated
    # container would start with empty queues
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nook
      RABBITMQ_DEFAULT_PASS: nook
    # host port 5673 for running the API outside Docker (AMQP_URL=amqp://nook:nook@localhost:5673)
    ports:
      - '5673:5672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot: applies pending migrations, then exits. The API starts after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: build
    command: ['pnpm', '--filter', '@nook/api', 'db:deploy']
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: runtime
      args:
        VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
      # Required: copy infra/.env.example to infra/.env and fill it in (docker compose reads it automatically)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (see infra/.env.example)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Google sign-in stays disabled until both are set
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      # Plain http on localhost; set to true once the stack is served over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Public address: canonical links, Open Graph and sitemap of published pages
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Optional Google Analytics 4 (G-XXXX) for published pages and the app
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # Optional Telegram bot (morning plan, /today)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_DIGEST_HOUR_UTC: ${TELEGRAM_DIGEST_HOUR_UTC:-6}
      # List cache; the API keeps working (without cache) when Redis is down
      REDIS_URL: redis://redis:6379
      # Queues for reminders and Google sync jobs; the API starts even if the broker is away and keeps trying
      AMQP_URL: amqp://nook:nook@rabbitmq:5672
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-30}
      GOOGLE_SYNC_EVERY_MINUTES: ${GOOGLE_SYNC_EVERY_MINUTES:-30}
      # Optional: uploaded files in Azure Blob Storage instead of the uploads volume (docs/c19-blob-storage.md)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nook-uploads}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  uploads:

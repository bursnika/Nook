name: nook

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    # 5433 to not clash with a local postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    # data dir depends on the hostname
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nook
      RABBITMQ_DEFAULT_PASS: nook
    ports:
      - '5673:5672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: build
    command: ['pnpm', '--filter', '@nook/api', 'db:deploy']
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: runtime
      args:
        VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (see infra/.env.example)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://nook:nook@rabbitmq:5672
      GOOGLE_SYNC_EVERY_MINUTES: ${GOOGLE_SYNC_EVERY_MINUTES:-30}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nook-uploads}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  uploads:

name: nook
# host port 5433 (not 5432) so it does not clash with other local Postgres instances

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
